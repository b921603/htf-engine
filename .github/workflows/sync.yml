name: htf-sync
# Hourly RSS diff → new episode → full pipeline (audio/transcode/subtitles/
# intro/official-cover/create/verify/register-rotation) → ntfy notification.
on:
  schedule:
    - cron: "23 * * * *"      # hourly (GitHub cron drifts a few minutes — fine)
  workflow_dispatch:
    inputs:
      force:
        description: "Only process episodes whose title contains this (e.g. Sue Perkins). Bypasses done/match guards — creates a real duplicate; for supervised tests only."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: htf-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: restore state (done/ledger/rotate_cache/…)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: htf-state-${{ github.run_id }}
          restore-keys: htf-state-
      - name: run sync
        env:
          EUDIC_COOKIE: ${{ secrets.EUDIC_COOKIE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HTF_BASE: ${{ github.workspace }}/state
          HTF_FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$HTF_FORCE" ]; then
            echo "force mode: $HTF_FORCE"
            python3 htf_engine.py sync --force "$HTF_FORCE"
          else
            python3 htf_engine.py sync
          fi
      - name: save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: htf-state-${{ github.run_id }}
      - name: notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, requests, os
          rid = os.environ.get("RUN_ID", "unknown")
          msg = {"topic": os.environ["NTFY_TOPIC"], "title": "HTF GA: sync failed",
                 "priority": 4, "tags": ["rotating_light"],
                 "message": ("GitHub Actions sync 失敗（run " + rid + "）。\n" +
                             "查日誌：https://github.com/b921603/htf-sync/actions/run/" + rid +
                             "\n常見原因：cookie 過期（同時會發 HTF GA: cookie expired）或上傳鏈路異常。")}
          requests.post("https://ntfy.sh/", data=json.dumps(msg), timeout=20)
          PY
      - name: commit audit ledger (public trail)
        run: |
          git config user.name "htf-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p trail && cp -f state/sync_ledger.jsonl trail/ 2>/dev/null || true
          git add trail/sync_ledger.jsonl 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "ledger: run ${{ github.run_id }} [skip ci]" && git push)
