name: htf-rotate
# Hourly LRU cover rotation (2 shards) — defeats the platform's fid GC +
# render-cache expiry (~1.7–3.4 h). Each shard re-POSTs articles with cached
# byte-identical lrc/desc/intros + a freshly uploaded official cover fid.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    concurrency:
      group: htf-rot-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: restore rotate cache (written by htf-sync)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: htf-state-ro-${{ github.run_id }}
          restore-keys: htf-state-
      - name: restore per-shard LRU state
        uses: actions/cache/restore@v4
        with:
          path: rotstate
          key: htf-rot-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: htf-rot-${{ matrix.shard }}-
      - name: rotate shard
        env:
          EUDIC_COOKIE: ${{ secrets.EUDIC_COOKIE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HTF_BASE: ${{ github.workspace }}/state
          HTF_ROTDIR: ${{ github.workspace }}/rotstate
        run: python3 htf_engine.py rotate --shard ${{ matrix.shard }}/2 --budget 1400
      - name: save per-shard state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: rotstate
          key: htf-rot-${{ matrix.shard }}-${{ github.run_id }}
